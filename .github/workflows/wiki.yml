# Publish wiki/*.md to this repository's GitHub wiki whenever they change.
# The wiki must exist first: create any page once in the web UI (Wiki tab),
# after which this workflow owns its content.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the token reaches git only through its configuration environment
          # (GIT_CONFIG_*): never on a command line, in the URL, in .git/config
          # or in a credential store
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0=http.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git clone "https://github.com/${{ github.repository }}.wiki.git" /tmp/wiki

      - name: Sync pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rsync -a --delete --exclude .git wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki unchanged"; exit 0; }
          git commit -m "Sync wiki from ${{ github.sha }}"
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0=http.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          git push
