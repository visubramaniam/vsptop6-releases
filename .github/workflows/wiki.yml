# Publish wiki/*.md to this repository's GitHub wiki whenever they change.
# The wiki must exist first: create any page once in the web UI (Wiki tab),
# after which this workflow owns its content.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # token goes in an auth header, never in the URL or .git/config
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" clone \
            "https://github.com/${{ github.repository }}.wiki.git" /tmp/wiki
          git -C /tmp/wiki config "http.extraheader" "AUTHORIZATION: basic $AUTH"

      - name: Sync pages
        run: |
          rsync -a --delete --exclude .git wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki unchanged"; exit 0; }
          git commit -m "Sync wiki from ${{ github.sha }}"
          git push
